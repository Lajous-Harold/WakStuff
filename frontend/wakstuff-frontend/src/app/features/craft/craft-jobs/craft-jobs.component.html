<div class="craft-jobs-container">
  <header class="page-header">
    <div class="header-content">
      <h1>Métiers de Craft</h1>
      <p class="subtitle">Choisissez un métier pour voir ses recettes</p>
    </div>
    <button class="my-crafts-btn" routerLink="/craft/my-crafts">⭐ Mes Crafts</button>
  </header>

  @if (loading()) {
  <app-loading-spinner />
  } @if (error()) {
  <app-error-message [message]="error()!" />
  } @if (!loading() && !error()) {
  <div class="jobs-grid">
    @for (job of craftJobs(); track job.id) {
    <div class="job-card" (click)="navigateToJob(job.id)">
      <div class="job-icon">{{ getJobIcon(job.name) }}</div>
      <h3 class="job-name">{{ job.name }}</h3>
    </div>
    }
  </div>
  }
</div>
