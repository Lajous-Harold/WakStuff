<div class="app-container">
  <header class="app-header">
    <div class="header-content">
      <div class="brand">
        <h1 class="brand-title">WakStuff</h1>
        <span class="brand-subtitle">Base de données Wakfu</span>
      </div>

      <nav class="main-nav">
        <a
          routerLink="/items"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link"
        >
          <span class="nav-icon">📦</span>
          <span class="nav-text">Items</span>
        </a>
        <a routerLink="/categories" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">📂</span>
          <span class="nav-text">Catégories</span>
        </a>
        <a routerLink="/craft-calculator" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">🔨</span>
          <span class="nav-text">Calculateur</span>
        </a>
        <a routerLink="/stats" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">📊</span>
          <span class="nav-text">Stats</span>
        </a>
        <a routerLink="/imports" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">Imports</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>&copy; 2025 WakStuff - Données issues de l'API Wakfu</p>
  </footer>
</div>
