<div class="app-container">
  <header class="app-header">
    <div class="header-content">
      <div class="brand">
        <h1 class="brand-title">WakStuff</h1>
        <span class="brand-subtitle">Base de données Wakfu</span>
      </div>

      <nav class="main-nav">
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          <span class="nav-icon">🏠</span>
          <span class="nav-text">Dashboard</span>
        </a>
        <a
          routerLink="/search"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link"
        >
          <span class="nav-icon">🔍</span>
          <span class="nav-text">Recherche</span>
        </a>
        <a
          routerLink="/items"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link"
        >
          <span class="nav-icon">📦</span>
          <span class="nav-text">Items</span>
        </a>
        <a
          routerLink="/resources"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link"
        >
          <span class="nav-icon">🌾</span>
          <span class="nav-text">Ressources</span>
        </a>
        <a
          routerLink="/harvest"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link"
        >
          <span class="nav-icon">⛏️</span>
          <span class="nav-text">Récolte</span>
        </a>
        <a
          routerLink="/harvest-optimizer"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link"
        >
          <span class="nav-icon">🗺️</span>
          <span class="nav-text">Optimizer</span>
        </a>
        <a
          routerLink="/craft"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link"
        >
          <span class="nav-icon">🔨</span>
          <span class="nav-text">Craft</span>
        </a>
        <a
          routerLink="/craft/my-crafts"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link"
        >
          <span class="nav-icon">⭐</span>
          <span class="nav-text">Mes Crafts</span>
        </a>
        <a
          routerLink="/imports"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link"
        >
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">Imports</span>
        </a>
        <a
          routerLink="/analytics"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }"
          class="nav-link"
        >
          <span class="nav-icon">📊</span>
          <span class="nav-text">Analytics</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>&copy; 2025 WakStuff - Données issues de l'API Wakfu</p>
  </footer>
</div>
